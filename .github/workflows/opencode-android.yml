name: OpenCode Android APK

on:
  push:
    paths:
      - "opencode-android/**"
      - ".github/workflows/opencode-android.yml"
  workflow_dispatch:

# Read-only by default; only the publish job can write releases.
permissions:
  contents: read

concurrency:
  group: opencode-android
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (the comment shows the tag they came from).
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app }}
      opencode_version: ${{ steps.version.outputs.opencode }}
    defaults:
      run:
        working-directory: opencode-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      # Reuse one signing key so each new APK installs over the previous one and keeps its data.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: opencode-android-debug-keystore-v1

      - name: Read versions
        id: version
        run: |
          echo "app=$(sed -n 's/^appVersion=//p' version.properties)" >> "$GITHUB_OUTPUT"
          echo "opencode=$(sed -n 's/^version=//p' app/src/main/assets/setup.sh)" >> "$GITHUB_OUTPUT"

      - name: Fetch proot and Alpine rootfs
        run: scripts/fetch-native.sh

      - name: Test and build
        run: gradle :core:test :app:assembleRelease --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk opencode-android.apk

      - name: Check the APK bundles proot and the rootfs
        run: |
          contents=$(unzip -l opencode-android.apk)
          for entry in lib/arm64-v8a/libproot.so lib/arm64-v8a/libproot-loader.so lib/arm64-v8a/libtalloc.so \
            lib/arm64-v8a/libandroid-shmem.so assets/alpine-rootfs.bin assets/setup.sh; do
            grep -q " $entry$" <<<"$contents" || { echo "APK is missing $entry" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-android-apk
          path: opencode-android/opencode-android.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opencode-android-apk

      - name: Publish the versioned release and the rolling latest one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          OPENCODE_VERSION: ${{ needs.build.outputs.opencode_version }}
        run: |
          sha=$(sha256sum opencode-android.apk | cut -d ' ' -f 1)
          title="OpenCode Android $APP_VERSION (OpenCode $OPENCODE_VERSION)"
          notes="Build $GITHUB_RUN_NUMBER from $GITHUB_REF_NAME at $GITHUB_SHA. Changes: opencode-android/CHANGELOG.md. Install opencode-android.apk on an arm64 Android phone. SHA256: $sha"
          tag="opencode-android-v$APP_VERSION"
          # A rebuild of the same version replaces that release's APK.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" opencode-android.apk --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" opencode-android.apk --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
          if gh release view opencode-android-latest >/dev/null 2>&1; then
            gh release delete opencode-android-latest --yes --cleanup-tag
          fi
          gh release create opencode-android-latest opencode-android.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$title (latest build)" \
            --notes "$notes"
